<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fastar – video to track</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; }
      video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; }
      p { position: fixed; left: 0; right: 0; bottom: 8px; margin: 0; text-align: center; color: #888; font: 13px system-ui; }
    </style>
  </head>
  <body>
    <video src="clip.mp4" autoplay loop muted playsinline></video>
    <p id="hint">Click for full screen</p>
    <script>
      document.body.onclick = () => {
        document.documentElement.requestFullscreen?.();
        document.getElementById('hint').remove();
      };
    </script>
  </body>
</html>

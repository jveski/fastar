<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fastar – four videos to track</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      /* Four separate screens: a gap of black between them keeps their edges apart. */
      main { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 4vmin; box-sizing: border-box; height: 100%; padding: 4vmin; }
      video { width: 100%; height: 100%; object-fit: contain; min-height: 0; }
      p { position: fixed; left: 0; right: 0; bottom: 4px; margin: 0; text-align: center; color: #888; font: 13px system-ui; }
    </style>
  </head>
  <body>
    <main>
      <video src="clips/amber.mp4" autoplay loop muted playsinline></video>
      <video src="clips/cobalt.mp4" autoplay loop muted playsinline></video>
      <video src="clips/jade.mp4" autoplay loop muted playsinline></video>
      <video src="clips/coral.mp4" autoplay loop muted playsinline></video>
    </main>
    <p id="hint">Click for full screen</p>
    <script>
      document.body.onclick = () => {
        document.documentElement.requestFullscreen?.();
        document.getElementById('hint')?.remove();
        // Autoplay can be held back until a click.
        for (const v of document.querySelectorAll('video')) v.play();
      };
    </script>
  </body>
</html>

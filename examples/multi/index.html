<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Relative URLs below need the trailing slash; some static servers (serve's
      // cleanUrls) answer /dir with /dir/index.html without redirecting.
      if (!location.pathname.endsWith('/') && !/\.\w+$/.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>fastar – several video targets</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      video, canvas { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      button { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 14px 22px; font: 16px system-ui; }
      #status { position: fixed; left: 8px; right: 8px; bottom: 8px; margin: 0; color: #fff; font: 12px ui-monospace, monospace; white-space: pre; text-shadow: 0 0 3px #000; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js" } }
    </script>
  </head>
  <body>
    <video id="video" muted playsinline></video>
    <canvas id="gl"></canvas>
    <button id="start">Start AR</button>
    <pre id="status"></pre>
    <script type="module">
      import * as THREE from 'three';
      import { ImageTracker, ThreeAdapter } from '../../dist/fastar.js';

      const canvas = document.getElementById('gl');
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setPixelRatio(devicePixelRatio);
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera();
      scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2));

      // All four clips are tracked at once. When a camera frame is short of
      // time, the clips that matter less (smaller, cut off by the edge of the
      // view, or off centre) get fewer tracking points, or are updated less often.
      const ar = await ImageTracker.create({ targets: './targets.bin' });

      const three = new ThreeAdapter(ar, {
        THREE, scene, camera,
        viewSize: () => [canvas.clientWidth, canvas.clientHeight],
        // How many overlays stay loaded once their clip is out of view: 'auto' follows the device.
        content: { budget: 'auto', keepAlive: 5000 },
        render: (e) => {
          // videoTime: where each clip is in this camera frame (seconds).
          for (const [i, p] of e.poses) three.contents?.get(i)?.userData.update(p.videoTimeLocked ? p.videoTime : null);
          renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
          renderer.render(scene, camera);
        },
      });

      // Each clip's overlay is fetched only when the clip is found (or nearly
      // found): the shared overlay code once, and the clip's own description.
      ar.targets.forEach((target, i) => {
        three.content(i, async ({ signal, name }) => {
          const [{ createOverlay }, info] = await Promise.all([
            import('./overlay.js'),
            fetch(`./clips/${name}.json`, { signal }).then((r) => r.json()),
          ]);
          return createOverlay(THREE, target, info);
        });
      });

      const status = document.getElementById('status');
      document.getElementById('start').onclick = async (e) => {
        e.target.remove();
        try {
          await ar.start({ video: document.getElementById('video'), requestMotionPermission: true, syncDisplay: true });
        } catch (err) {
          status.textContent = String(err);
          throw err;
        }
        setInterval(() => {
          const s = ar.stats, c = three.contents;
          const rows = ar.targets.map((t, i) => {
            const r = s.targets.find((x) => x.index === i);
            const track = r
              ? `${r.status.padEnd(8)} priority ${(r.priority ?? 0).toFixed(2)}  ${String(r.points ?? 0).padStart(3)} pts${(r.every ?? 1) > 1 ? ` every ${r.every} frames` : ''}`
              : 'not in view';
            return `${t.name.padEnd(7)} ${track.padEnd(48)} overlay ${c?.state(i) ?? 'idle'}`;
          });
          const head = `${s.fps} fps | tracking ${(s.timings?.track ?? 0).toFixed(1)} of ${s.budgetMs.toFixed(1)} ms | overlays loaded ${c?.used ?? 0} of ${c?.budget ?? 0}`;
          status.textContent = [head, ...rows].join('\n');
        }, 250);
      };
    </script>
  </body>
</html>

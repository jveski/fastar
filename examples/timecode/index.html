<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      if (!location.pathname.endsWith('/') && !/\.\w+$/.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>fastar – audio timecode</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 16px system-ui; overflow: hidden; }
      #flash { position: fixed; inset: 0; background: #fff; opacity: 0; }
      main { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; gap: 12px; mix-blend-mode: difference; }
      #time { font: 600 15vw ui-monospace, monospace; font-variant-numeric: tabular-nums; }
      #state { font-size: 20px; }
      button { padding: 14px 22px; font: 16px system-ui; }
      #stats { position: fixed; left: 8px; right: 8px; bottom: 8px; margin: 0; font: 12px ui-monospace, monospace; white-space: pre-wrap; color: #aaa; }
    </style>
  </head>
  <body>
    <div id="flash"></div>
    <main>
      <div id="time">–:––:––.–</div>
      <div id="state">Plays the set's timecode? Tap to listen.</div>
      <div><button id="start">Listen</button></div>
    </main>
    <pre id="stats"></pre>
    <script type="module">
      import { TimecodeListener } from '../../dist/fastar.js';

      // The generator's options: ?key=my-set (and band, symbol, degree if changed).
      const q = new URLSearchParams(location.search);
      const options = {};
      if (q.get('key')) options.key = q.get('key');
      if (q.get('band')) options.band = q.get('band').split('-').map(Number);
      if (q.get('symbol')) options.symbol = Number(q.get('symbol'));
      if (q.get('degree')) options.degree = Number(q.get('degree'));

      const $ = (id) => document.getElementById(id);
      // Truncated, not rounded: the tenths show 0 from the moment the second starts, with the flash.
      const clock = (t) => {
        const tenths = Math.floor(t * 10), s = Math.floor(tenths / 10);
        const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
        return `${h}:${String(m).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}.${tenths % 10}`;
      };

      $('start').onclick = async () => {
        $('start').remove();
        // Created inside the tap: iOS only starts audio from a gesture.
        const tc = new TimecodeListener(options);
        try {
          await tc.start();
        } catch (e) {
          $('state').textContent = e.message;
          return;
        }
        $('state').textContent = 'Listening…';
        let last = NaN, interval = 1000 / 60;
        const frame = (now) => {
          requestAnimationFrame(frame);
          // What is drawn now reaches the screen about one frame later: show the set time of that moment.
          if (now - last > 0 && now - last < 100) interval += 0.1 * (now - last - interval);
          last = now;
          const t = tc.timeAt(now + interval), s = tc.stats;
          if (t) {
            $('time').textContent = clock(t.time);
            $('state').textContent = t.locked ? `locked ±${(t.std * 1000).toFixed(1)} ms`
              : s.calibration === 'measuring' ? 'measuring the microphone delay…' : 'finding the time…';
            // Every phone flashes on each whole second of the set: side by side, they flash together.
            const into = t.time - Math.floor(t.time);
            $('flash').style.opacity = t.locked && into < 0.08 ? 1 : 0;
          }
          $('stats').textContent =
            `${s.sampleRate} Hz; microphone delay ${s.latency.toFixed(0)} ms (${s.latencySource})\n` +
            `sweeps heard clearly: ${(s.clear * 100).toFixed(0)}% at ${s.snr.toFixed(1)} dB; ${s.symbols} read; ` +
            `${(s.errors * 100).toFixed(0)}% off the code${s.error ? `\n${s.error}` : ''}`;
        };
        requestAnimationFrame(frame);
      };
    </script>
  </body>
</html>

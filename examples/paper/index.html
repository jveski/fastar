<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Relative URLs below need the trailing slash; some static servers (serve's
      // cleanUrls) answer /dir with /dir/index.html without redirecting.
      if (!location.pathname.endsWith('/') && !/\.\w+$/.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>fastar – paper example</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      video, canvas { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      button { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 14px 22px; font: 16px system-ui; }
      #status { position: fixed; left: 8px; right: 8px; bottom: 8px; margin: 0; color: #fff; font: 12px ui-monospace, monospace; white-space: pre-wrap; text-shadow: 0 0 3px #000; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js" } }
    </script>
  </head>
  <body>
    <video id="video" muted playsinline></video>
    <canvas id="gl"></canvas>
    <button id="start">Start AR</button>
    <pre id="status"></pre>
    <script type="module">
      import * as THREE from 'three';
      import { ImageTracker, ThreeAdapter } from '../../dist/fastar.js';
      import { createFluid } from './fluid.js';

      const canvas = document.getElementById('gl');
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      // Resize only when the view or the pixel ratio changes: setSize reallocates the canvas.
      let ratio = Math.min(devicePixelRatio, 2), size = '';
      const fit = () => {
        const w = canvas.clientWidth, h = canvas.clientHeight, key = `${w}x${h}@${ratio}`;
        if (key === size) return;
        size = key;
        renderer.setPixelRatio(ratio);
        renderer.setSize(w, h, false);
      };
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera();
      scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 2.2));
      const sun = new THREE.DirectionalLight(0xffffff, 1.5);
      sun.position.set(0.3, 1, 0.8);
      scene.add(sun);

      // deformable: poses carry the page's shape (pose.surface) as it bends.
      const ar = await ImageTracker.create({ targets: './targets.bin', deformable: true });
      const fluid = createFluid(THREE, ar.targets[0]);
      const down = new THREE.Vector3(0, -1, 0), measured = new THREE.Vector3();
      let last = performance.now();
      // A device that cannot keep up asks for a lower pixel ratio (and back up once it can).
      ar.on('performance', (p) => { ratio = Math.min(p.pixelRatio, 2); });
      const three = new ThreeAdapter(ar, {
        THREE, scene, camera,
        viewSize: () => [canvas.clientWidth, canvas.clientHeight],
        render: (e) => {
          const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000);
          last = now;
          const p = e.poses.get(0);
          if (p) {
            // Gravity in the page's coordinates; without motion sensors, down the screen (the camera's +y).
            if (p.gravity) measured.fromArray(p.gravity);
            else measured.set(p.R[3], -p.R[4], -p.R[5]);
            down.lerp(measured, 0.2).normalize();
            fluid.update(p.surface ?? null, down.toArray(), dt);
          }
          fit();
          renderer.render(scene, camera);
        },
      });
      // The page's shape, drawn with contour lines; the drops live in the page's anchor.
      three.surface(0, { material: fluid.surfaceMaterial });
      three.anchor(0).add(fluid.root);

      const status = document.getElementById('status');
      document.getElementById('start').onclick = async (e) => {
        e.target.remove();
        try {
          await ar.start({ video: document.getElementById('video'), requestMotionPermission: true, syncDisplay: true });
        } catch (err) {
          status.textContent = String(err);
          throw err;
        }
        setInterval(() => {
          const s = ar.stats;
          const t = s.targets.map((r) => r.status).join('; ') || 'searching (hold the page flat)';
          status.textContent = `${s.fps} fps | ${s.sensors === 'none' ? 'no motion sensors' : 'gravity from sensors'} | ${t} | ${fluid.count} drops`;
        }, 250);
      };
    </script>
  </body>
</html>

name: Browser tests

on:
  push:
    branches: [browser-e2e]
  schedule:
    # Nightly, after the fast unit suite has had a chance to run.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-and-emulated:
    name: Desktop, emulated mobile, fake camera
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg for the fake-camera fixture
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build bundle and harness
        run: |
          npm run build
          node test/browser/build.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright projects
        run: npx playwright test

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results
            playwright-report
          retention-days: 14

  android-emulator:
    name: Android emulator Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundle and harness
        run: |
          npm run build
          node test/browser/build.mjs

      - name: Install Appium and UiAutomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Start Appium
        run: |
          appium --port 4723 --log-level info > appium.log 2>&1 &
          for i in {1..60}; do
            if curl -sf http://127.0.0.1:4723/status >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Appium failed to start" >&2
          cat appium.log >&2
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb reverse tcp:4173 tcp:4173
            adb shell pm list packages | grep com.android.chrome
            npm run test:browser:android

      - name: Upload Appium log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-appium-log
          path: appium.log
          retention-days: 14

  ios-simulator:
    name: iOS Simulator Safari
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundle and harness
        run: |
          npm run build
          node test/browser/build.mjs

      - name: Install Appium and XCUITest driver
        run: |
          npm install -g appium
          appium driver install xcuitest

      - name: Start Appium
        run: |
          appium --port 4723 --log-level info > appium.log 2>&1 &
          for i in {1..60}; do
            if curl -sf http://127.0.0.1:4723/status >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Appium failed to start" >&2
          cat appium.log >&2
          exit 1

      - name: Run on iOS Simulator
        run: npm run test:browser:ios

      - name: Upload Appium log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log
          path: appium.log
          retention-days: 14
